<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 · Editorial suizo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  :root { --paper: #eeeae1; --ink: #111; --red: #e2341d; --mute: #1118; --rule: #11111a26; }
  body { background: var(--paper); color: var(--ink); font-family: 'Inter Tight', system-ui, sans-serif; min-height: 100vh; }
  .mono { font: 500 11px/1.2 'JetBrains Mono', monospace; letter-spacing: .04em; text-transform: uppercase; }
  .app { padding: 16px 18px 32px; display: grid; grid-template-columns: minmax(0, 1fr); }
  .wide { display: none; }
  .top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 3px solid var(--ink); position: relative; }
  .top::after { content: ''; position: absolute; left: 0; bottom: -3px; height: 3px; width: 28%; background: var(--red); animation: sweep 1.2s cubic-bezier(.7,0,.2,1); }
  @keyframes sweep { from { width: 0; } }
  .brand { font-weight: 900; font-size: 22px; letter-spacing: -.05em; }
  .brand i { font-style: normal; color: var(--red); }
  .top .mono { display: flex; gap: 14px; }
  .top b { font-weight: 500; color: var(--red); }

  .kick { display: flex; justify-content: space-between; padding-top: 14px; }
  h1 { margin: 12px 0 0 -.06em; font-weight: 900; font-size: 23vw; line-height: .78; letter-spacing: -.075em; animation: rise .7s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } }
  .lede { margin-top: 14px; max-width: 30ch; font-weight: 500; font-size: 15px; line-height: 1.35; color: var(--mute); }
  .controls { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; margin-top: 18px; padding: 14px 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .play { width: 54px; height: 54px; background: var(--red); color: #fff; display: grid; place-items: center; font-size: 22px; }
  .master { display: grid; gap: 7px; }
  .track { position: relative; height: 14px; }
  .track::before { content: ''; position: absolute; inset: 50% 0 auto; height: 1px; background: var(--ink); }
  .fill { position: absolute; left: 0; top: calc(50% - 2px); height: 4px; width: calc(var(--v) * 100%); background: var(--ink); }
  .knob { position: absolute; top: 0; left: calc(var(--v) * 100% - 7px); width: 14px; height: 14px; background: var(--red); }
  .big { font-weight: 800; font-size: 34px; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }

  .row { display: grid; grid-template-columns: 26px 18px minmax(0, 1fr) minmax(0, 1.3fr) 46px; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); animation: rise .5s both cubic-bezier(.2,.8,.2,1); animation-delay: calc(var(--i) * 50ms); }
  .row .n { color: var(--mute); }
  .row .ico { font-size: 18px; }
  .row .name { font-weight: 600; font-size: 17px; letter-spacing: -.015em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .val { text-align: right; font-weight: 800; font-size: 24px; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
  .row.off { color: #1115; }
  .row.off .knob { background: #1115; }

  .index { margin-top: 30px; }
  .tabs { display: flex; gap: 18px; align-items: baseline; border-bottom: 3px solid var(--ink); padding-bottom: 8px; }
  .tabs h2 { font-size: 30px; font-weight: 900; letter-spacing: -.055em; }
  .tabs span { font-weight: 700; font-size: 15px; color: var(--mute); }
  .tabs .mono { margin-left: auto; }
  .list { display: grid; column-gap: 28px; }
  .item { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto 18px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .item .n { color: var(--mute); }
  .item .nm { font-weight: 800; font-size: 21px; letter-spacing: -.04em; }
  .item .ico { font-size: 18px; }
  .item.on { color: var(--red); }
  .item.on .n { color: var(--red); }

  @media (min-width: 700px) {
    .app { padding: 26px 34px; }
    .wide { display: inline; }
    h1 { font-size: 190px; }
    .lede { font-size: 17px; }
    .list { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1100px) {
    .app { grid-template-columns: 7fr 5fr; height: 100vh; padding: 26px 40px 0; align-content: start; }
    .top { grid-column: 1 / -1; }
    .now { padding-right: 40px; border-right: 1px solid var(--ink); }
    h1 { font-size: 200px; }
    .lede { display: none; }
    .index { margin: 0; padding: 14px 0 0 34px; }
    .list { grid-template-columns: 1fr; }
    .item { padding: 9px 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">domentum<i>.</i></div>
    <div class="mono"><span><span class="wide">Temporizador </span><b id="timer"></b></span><span>Menú</span></div>
  </header>
  <section class="now">
    <div class="kick mono"><span>01 / 14 — Sonando</span><span>6 capas</span></div>
    <h1 id="title"></h1>
    <p class="lede">Velero, olas y gaviotas sobre mar abierto. Cada capa a su volumen, sin límite de tiempo.</p>
    <div class="controls">
      <button class="play" id="play"></button>
      <div class="master">
        <span class="mono">Volumen general</span>
        <div class="track" id="master"><div class="fill"></div><div class="knob"></div></div>
      </div>
      <span class="big" id="masterv"></span>
    </div>
    <div id="layers"></div>
  </section>
  <section class="index">
    <div class="tabs"><h2>Paisajes</h2><span>Mezclas</span><span class="mono">14</span></div>
    <div class="list" id="list"></div>
  </section>
</div>
<script type="module">
  import { SCENES, NOW, LAYERS, MASTER, TIMER, icon, pct, pad, meta, html } from './data.js';
  html('#title', NOW.name);
  html('#timer', TIMER);
  html('#play', icon('pause'));
  html('#masterv', pct(MASTER));
  document.querySelector('#master').style.setProperty('--v', MASTER);
  html('#layers', LAYERS.map((l, i) => `
    <div class="row ${l.v ? '' : 'off'}" style="--v:${l.v};--i:${i}">
      <span class="n mono">${pad(i + 1)}</span>${icon(l.icon)}<span class="name">${l.name}</span>
      <div class="track"><div class="fill"></div><div class="knob"></div></div>
      <span class="val">${pct(l.v)}</span>
    </div>`).join(''));
  html('#list', SCENES.map((s, i) => `
    <div class="item ${s.id === NOW.id ? 'on' : ''}">
      <span class="n mono">${pad(i + 1)}</span><span class="nm">${s.name}</span><span class="mono">${meta(s)}</span>${icon(s.icon)}
    </div>`).join(''));
</script>
</body>
</html>
